<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin – Vectra Kanały</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f4f6f9; color: #1a1a2e; }

    .app-header {
      background: linear-gradient(135deg, #0d1b4b, #1a3a8f);
      color: #fff; padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 12px rgba(0,0,0,.25);
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-left .logo { font-size: 1.6rem; }
    .header-left h1 { font-size: 1.15rem; font-weight: 700; }
    .header-left p { font-size: .78rem; opacity: .7; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .header-right a { color: rgba(255,255,255,.8); font-size: .85rem; text-decoration: none; }
    .header-right a:hover { color: #fff; }
    .btn-logout {
      background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3);
      color: #fff; padding: 6px 14px; border-radius: 6px; font-size: .85rem;
      cursor: pointer; transition: background .15s;
    }
    .btn-logout:hover { background: rgba(255,255,255,.25); }

    .main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }

    .tabs { display: flex; gap: 4px; border-bottom: 2px solid #d0d8e8; margin-bottom: 20px; }
    .tab-btn {
      padding: 10px 22px; border: none; background: none;
      font-size: .92rem; font-weight: 600; color: #5a6a8a; cursor: pointer;
      border-bottom: 3px solid transparent; margin-bottom: -2px;
      border-radius: 4px 4px 0 0; transition: all .15s;
    }
    .tab-btn:hover { color: #1a3a8f; background: #eef2ff; }
    .tab-btn.active { color: #1a3a8f; border-bottom-color: #1a3a8f; background: #fff; }

    .section { display: none; }
    .section.active { display: block; }

    /* ── Card ── */
    .card {
      background: #fff; border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08); overflow: hidden; margin-bottom: 20px;
    }
    .card-header {
      padding: 14px 20px; background: #f8fafd;
      border-bottom: 1px solid #e8edf5;
      display: flex; align-items: center; justify-content: space-between;
    }
    .card-header h2 { font-size: 1rem; font-weight: 700; color: #1a2a4a; }
    .badge {
      background: #e8f5e2; color: #2d5a1b; border: 1px solid #a0d080;
      padding: 2px 10px; border-radius: 12px; font-size: .78rem; font-weight: 600;
    }
    .badge.warn { background: #fff8e1; color: #6b4e00; border-color: #f0c040; }

    /* ── Formularz dodaj usera ── */
    .add-user-form {
      padding: 16px 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end;
      border-bottom: 1px solid #e8edf5;
    }
    .add-user-form label { font-size: .82rem; font-weight: 600; color: #3a4a6a; display: block; margin-bottom: 4px; }
    .add-user-form input, .add-user-form select {
      padding: 8px 12px; border: 1.5px solid #c8d4e8; border-radius: 7px;
      font-size: .88rem; outline: none;
    }
    .add-user-form input:focus, .add-user-form select:focus { border-color: #1a3a8f; }
    .btn-add {
      padding: 9px 18px; background: #1a3a8f; color: #fff;
      border: none; border-radius: 7px; font-size: .88rem; font-weight: 600;
      cursor: pointer; transition: opacity .15s; align-self: flex-end;
    }
    .btn-add:hover { opacity: .85; }

    /* ── Tabela ── */
    table { width: 100%; border-collapse: collapse; font-size: .86rem; }
    thead { background: #0d1b4b; color: #fff; }
    th { padding: 10px 14px; text-align: left; font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .3px; }
    td { padding: 10px 14px; border-bottom: 1px solid #f0f4f8; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafd; }

    .role-badge {
      padding: 2px 9px; border-radius: 12px; font-size: .75rem; font-weight: 700;
      display: inline-block;
    }
    .role-admin     { background: #ddeeff; color: #1a3a8f; }
    .role-superadmin { background: #f5e8ff; color: #6b1a9c; }
    .role-user      { background: #f0f4f8; color: #4a5a7a; }

    .status-badge {
      padding: 2px 9px; border-radius: 12px; font-size: .75rem; font-weight: 600;
      display: inline-block;
    }
    .status-active  { background: #e8f5e2; color: #2d5a1b; }
    .status-pending { background: #fff8e1; color: #6b4e00; }
    .status-inactive { background: #fde8e8; color: #8b1a1a; }

    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-action {
      padding: 4px 10px; border-radius: 6px; font-size: .78rem; font-weight: 600;
      border: 1.5px solid; cursor: pointer; transition: all .15s; background: #fff;
    }
    .btn-approve { color: #2d5a1b; border-color: #a0d080; }
    .btn-approve:hover { background: #e8f5e2; }
    .btn-role    { color: #1a3a8f; border-color: #a0b8e8; }
    .btn-role:hover { background: #eef2ff; }
    .btn-unblock { color: #a05000; border-color: #f0c040; }
    .btn-unblock:hover { background: #fff8e1; }
    .btn-reset   { color: #6b00b8; border-color: #c080f0; }
    .btn-reset:hover { background: #f5e8ff; }
    .btn-delete  { color: #8b1a1a; border-color: #f5a0a0; }
    .btn-delete:hover { background: #fde8e8; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.5);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal {
      background: #fff; border-radius: 12px; padding: 28px 32px;
      box-shadow: 0 8px 40px rgba(0,0,0,.25); min-width: 320px;
    }
    .modal h3 { font-size: 1.05rem; font-weight: 700; color: #1a2a4a; margin-bottom: 6px; }
    .modal p  { font-size: .85rem; color: #5a6a8a; margin-bottom: 16px; }
    .modal input {
      width: 100%; padding: 9px 12px; border: 1.5px solid #c8d4e8;
      border-radius: 7px; font-size: .92rem; outline: none; margin-bottom: 16px;
    }
    .modal input:focus { border-color: #1a3a8f; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .btn-cancel {
      padding: 8px 16px; border: 1.5px solid #c8d4e8; border-radius: 7px;
      background: #fff; font-size: .88rem; cursor: pointer; color: #5a6a8a;
    }
    .btn-cancel:hover { background: #f0f4f8; }

    /* ── Theme toggle ── */
    .btn-theme {
      background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3);
      color: #fff; padding: 5px 10px; border-radius: 6px;
      font-size: 1rem; cursor: pointer; line-height: 1; transition: background .15s;
    }
    .btn-theme:hover { background: rgba(255,255,255,.25); }

    /* ── Dark mode ── */
    body.dark { background: #111827; color: #e5e7eb; }
    body.dark .card { background: #1f2937; box-shadow: 0 2px 12px rgba(0,0,0,.4); }
    body.dark .card-header { background: #161f30; border-bottom-color: #374151; }
    body.dark .card-header h2 { color: #c4d4ff; }
    body.dark .add-user-form { border-bottom-color: #374151; }
    body.dark .add-user-form label { color: #9ca3af; }
    body.dark .add-user-form input,
    body.dark .add-user-form select { background: #111827; border-color: #374151; color: #e5e7eb; }
    body.dark table thead { background: #0a1128; }
    body.dark td { border-bottom-color: #374151; color: #e5e7eb; }
    body.dark tr:hover td { background: #263040; }
    body.dark .tabs { border-bottom-color: #374151; }
    body.dark .tab-btn { color: #9ca3af; }
    body.dark .tab-btn:hover { color: #c4d4ff; background: #1f2937; }
    body.dark .tab-btn.active { color: #93b4ff; border-bottom-color: #93b4ff; background: #1f2937; }
    body.dark .log-filter { border-bottom-color: #374151; }
    body.dark .log-filter input { background: #111827; border-color: #374151; color: #e5e7eb; }
    body.dark .pagination { color: #9ca3af; }
    body.dark .btn-page { background: #1f2937; border-color: #374151; color: #9ca3af; }
    body.dark .btn-page:hover { border-color: #93b4ff; color: #93b4ff; }
    body.dark .btn-action { background: #1f2937; }
    body.dark .btn-approve:hover { background: #1a2e10; }
    body.dark .btn-role:hover { background: #1a2550; }
    body.dark .btn-reset:hover { background: #2d1a40; }
    body.dark .btn-unblock:hover { background: #2d1f00; }
    body.dark .btn-delete:hover { background: #2d0a0a; }
    body.dark .modal { background: #1f2937; }
    body.dark .modal h3 { color: #e5e7eb; }
    body.dark .modal p { color: #9ca3af; }
    body.dark .modal input { background: #111827; border-color: #374151; color: #e5e7eb; }
    body.dark .btn-cancel { background: #1f2937; border-color: #374151; color: #9ca3af; }
    body.dark .btn-cancel:hover { background: #263040; }

    /* ── Alert globalny ── */
    .toast {
      position: fixed; top: 20px; right: 20px; z-index: 9999;
      background: #e8f5e2; border: 1px solid #a0d080; color: #2d5a1b;
      padding: 12px 20px; border-radius: 8px; font-size: .9rem; font-weight: 600;
      box-shadow: 0 4px 20px rgba(0,0,0,.15);
      transition: opacity .3s; display: none;
    }
    .toast.show { display: block; }
    .toast.err  { background: #fde8e8; border-color: #f5a0a0; color: #8b1a1a; }

    /* ── Logi ── */
    .log-filter { padding: 12px 20px; border-bottom: 1px solid #e8edf5; display: flex; gap: 10px; }
    .log-filter input {
      flex: 1; padding: 8px 12px; border: 1.5px solid #c8d4e8;
      border-radius: 7px; font-size: .88rem; outline: none;
    }
    .log-filter input:focus { border-color: #1a3a8f; }
    .log-action-badge {
      padding: 2px 8px; border-radius: 10px; font-size: .72rem; font-weight: 600;
      display: inline-block;
    }
    .log-login    { background: #ddeeff; color: #1a3a8f; }
    .log-blocked  { background: #fde8e8; color: #8b1a1a; }
    .log-approved { background: #e8f5e2; color: #2d5a1b; }
    .log-other    { background: #f0f4f8; color: #4a5a7a; }
    .pagination { padding: 12px 20px; display: flex; gap: 8px; align-items: center; font-size: .85rem; }
    .btn-page {
      padding: 5px 12px; border: 1.5px solid #c8d4e8; border-radius: 6px;
      background: #fff; cursor: pointer; font-size: .82rem;
    }
    .btn-page:hover { border-color: #1a3a8f; color: #1a3a8f; }
    .btn-page:disabled { opacity: .4; cursor: default; }
    .empty { padding: 30px; text-align: center; color: #8a9ab5; font-size: .9rem; }
  </style>
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <span class="logo">📡</span>
    <div>
      <h1>Vectra – Panel Admina</h1>
      <p id="admin-email">Ładowanie...</p>
    </div>
  </div>
  <div class="header-right">
    <button class="btn-theme" id="theme-btn" onclick="toggleTheme()" title="Zmień motyw">🌙</button>
    <a href="/">← Wróć do aplikacji</a>
    <form method="POST" action="/auth/logout" style="display:inline">
      <button type="submit" class="btn-logout">Wyloguj</button>
    </form>
  </div>
</header>

<main class="main">
  <div class="tabs">
    <button class="tab-btn active" onclick="showSection('users')">Użytkownicy <span id="pending-badge"></span></button>
    <button class="tab-btn" onclick="showSection('activity')">Historia logowań</button>
  </div>

  <!-- ── Sekcja: Użytkownicy ── -->
  <div class="section active" id="section-users">

    <!-- Oczekujące konta -->
    <div class="card" id="card-pending" style="display:none">
      <div class="card-header">
        <h2>Oczekujące konta</h2>
        <span class="badge warn" id="pending-count">0</span>
      </div>
      <table>
        <thead><tr><th>E-mail</th><th>Data rejestracji</th><th>Akcja</th></tr></thead>
        <tbody id="tbody-pending"></tbody>
      </table>
    </div>

    <!-- Dodaj użytkownika -->
    <div class="card">
      <div class="card-header"><h2>Dodaj użytkownika</h2></div>
      <div class="add-user-form">
        <div>
          <label>E-mail</label>
          <input type="email" id="new-email" placeholder="email@example.com" style="width:220px"/>
        </div>
        <div>
          <label>Hasło</label>
          <input type="password" id="new-pass" placeholder="min. 6 znaków" style="width:160px"/>
        </div>
        <div>
          <label>Rola</label>
          <select id="new-role">
            <option value="user">User</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <button class="btn-add" onclick="addUser()">Dodaj</button>
      </div>
    </div>

    <!-- Wszyscy użytkownicy -->
    <div class="card">
      <div class="card-header">
        <h2>Wszyscy użytkownicy</h2>
        <span class="badge" id="users-count">0</span>
      </div>
      <table>
        <thead><tr><th>E-mail</th><th>Rola</th><th>Status</th><th>Utworzono</th><th>Akcje</th></tr></thead>
        <tbody id="tbody-users"></tbody>
      </table>
    </div>
  </div>

  <!-- ── Sekcja: Historia ── -->
  <div class="section" id="section-activity">
    <div class="card">
      <div class="card-header"><h2>Historia logowań i działań</h2></div>
      <div class="log-filter">
        <input type="text" id="log-search" placeholder="Filtruj po e-mailu lub akcji…" oninput="filterLogs()"/>
      </div>
      <table>
        <thead><tr><th>E-mail</th><th>Akcja</th><th>Szczegóły</th><th>Data</th></tr></thead>
        <tbody id="tbody-activity"></tbody>
      </table>
      <div class="pagination">
        <button class="btn-page" id="btn-prev" onclick="changePage(-1)" disabled>← Poprzednia</button>
        <span id="page-info">Strona 1</span>
        <button class="btn-page" id="btn-next" onclick="changePage(1)">Następna →</button>
      </div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<!-- Modal: reset hasła -->
<div class="modal-overlay" id="reset-modal" style="display:none" onclick="cancelReset(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h3>Reset hasła</h3>
    <p id="reset-modal-label">Ustaw nowe hasło dla konta</p>
    <input type="password" id="reset-new-pass" placeholder="Nowe hasło (min. 6 znaków)" onkeydown="if(event.key==='Enter')confirmReset()"/>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="cancelReset()">Anuluj</button>
      <button class="btn-add" onclick="confirmReset()">Zapisz hasło</button>
    </div>
  </div>
</div>

<script>
  let allUsers = []
  let allLogs  = []
  let currentPage = 1

  function showSection(name) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'))
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'))
    document.getElementById('section-' + name).classList.add('active')
    event.target.classList.add('active')
    if (name === 'activity') loadActivity()
  }

  function toast(msg, err = false) {
    const el = document.getElementById('toast')
    el.textContent = msg
    el.className = 'toast show' + (err ? ' err' : '')
    setTimeout(() => el.classList.remove('show'), 3000)
  }

  function roleBadge(role) {
    const cls = role === 'admin' ? 'role-admin' : role === 'superadmin' ? 'role-superadmin' : 'role-user'
    return `<span class="role-badge ${cls}">${role}</span>`
  }

  function statusBadge(u) {
    if (u.pending) return '<span class="status-badge status-pending">Oczekuje</span>'
    if (!u.active) return '<span class="status-badge status-inactive">Nieaktywny</span>'
    return '<span class="status-badge status-active">Aktywny</span>'
  }

  function logBadge(action) {
    if (action === 'login')          return `<span class="log-action-badge log-login">logowanie</span>`
    if (action.includes('blocked'))  return `<span class="log-action-badge log-blocked">zablokowany</span>`
    if (action.includes('approved')) return `<span class="log-action-badge log-approved">zatwierdzono</span>`
    return `<span class="log-action-badge log-other">${action}</span>`
  }

  async function loadUsers() {
    const res = await fetch('/api/users')
    allUsers = await res.json()

    const pending  = allUsers.filter(u => u.pending)
    const regular  = allUsers.filter(u => !u.pending)

    document.getElementById('users-count').textContent = regular.length
    document.getElementById('pending-count').textContent = pending.length
    document.getElementById('card-pending').style.display = pending.length ? '' : 'none'

    const pb = document.getElementById('pending-badge')
    pb.textContent = pending.length ? ` (${pending.length})` : ''

    document.getElementById('tbody-pending').innerHTML = pending.map(u => `
      <tr>
        <td>${u.email}</td>
        <td>${u.created_at}</td>
        <td><div class="actions">
          <button class="btn-action btn-approve" onclick="approve(${u.id})">Zatwierdź</button>
          <button class="btn-action btn-delete" onclick="deleteUser(${u.id}, '${u.email}')">Odrzuć</button>
        </div></td>
      </tr>`).join('')

    document.getElementById('tbody-users').innerHTML = regular.map(u => `
      <tr>
        <td>${u.email}</td>
        <td>${roleBadge(u.role)}</td>
        <td>${statusBadge(u)}</td>
        <td>${u.created_at}</td>
        <td><div class="actions">
          ${!u.active && !u.pending ? `<button class="btn-action btn-unblock" onclick="unblock(${u.id})">Odblokuj</button>` : ''}
          <button class="btn-action btn-reset" onclick="resetPassword(${u.id}, '${u.email}')">Reset hasła</button>
          <button class="btn-action btn-role" onclick="toggleRole(${u.id}, '${u.role}')">${u.role === 'admin' ? '→ User' : '→ Admin'}</button>
          <button class="btn-action btn-delete" onclick="deleteUser(${u.id}, '${u.email}')">Usuń</button>
        </div></td>
      </tr>`).join('')
  }

  async function approve(id) {
    await fetch(`/api/users/${id}/approve`, { method: 'POST' })
    toast('Konto zatwierdzone')
    loadUsers()
  }

  async function unblock(id) {
    await fetch(`/api/users/${id}/unblock`, { method: 'POST' })
    toast('Konto odblokowane')
    loadUsers()
  }

  async function toggleRole(id, currentRole) {
    const newRole = currentRole === 'admin' ? 'user' : 'admin'
    await fetch(`/api/users/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ role: newRole })
    })
    toast(`Rola zmieniona na: ${newRole}`)
    loadUsers()
  }

  async function deleteUser(id, email) {
    if (!confirm(`Usunąć konto: ${email}?`)) return
    const res = await fetch(`/api/users/${id}`, { method: 'DELETE' })
    if (!res.ok) { const d = await res.json(); toast(d.error, true); return }
    toast('Konto usunięte')
    loadUsers()
  }

  async function addUser() {
    const email = document.getElementById('new-email').value.trim()
    const password = document.getElementById('new-pass').value
    const role = document.getElementById('new-role').value
    if (!email || !password) return toast('Uzupełnij email i hasło', true)
    const res = await fetch('/api/users', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, role })
    })
    if (!res.ok) { const d = await res.json(); toast(d.error, true); return }
    document.getElementById('new-email').value = ''
    document.getElementById('new-pass').value = ''
    toast('Użytkownik dodany')
    loadUsers()
  }

  async function loadActivity(page = currentPage) {
    currentPage = page
    const res = await fetch(`/api/activity?page=${page}`)
    const data = await res.json()
    allLogs = data.rows

    renderLogs(allLogs)
    document.getElementById('page-info').textContent = `Strona ${page}`
    document.getElementById('btn-prev').disabled = page <= 1
    document.getElementById('btn-next').disabled = data.rows.length < data.limit
  }

  function renderLogs(rows) {
    const q = document.getElementById('log-search').value.toLowerCase()
    const filtered = q ? rows.filter(r => r.user_email.includes(q) || r.action.includes(q) || (r.details||'').toLowerCase().includes(q)) : rows
    document.getElementById('tbody-activity').innerHTML = filtered.length
      ? filtered.map(r => `
          <tr>
            <td>${r.user_email}</td>
            <td>${logBadge(r.action)}</td>
            <td style="font-size:.82rem;color:#5a6a8a">${r.details || '–'}</td>
            <td style="white-space:nowrap">${r.created_at}</td>
          </tr>`).join('')
      : '<tr><td colspan="4" class="empty">Brak wpisów</td></tr>'
  }

  function filterLogs() { renderLogs(allLogs) }
  function changePage(dir) { loadActivity(currentPage + dir) }

  // ── Reset hasła ──
  let resetUserId = null
  function resetPassword(id, email) {
    resetUserId = id
    document.getElementById('reset-modal-label').textContent = `Ustaw nowe hasło dla: ${email}`
    document.getElementById('reset-new-pass').value = ''
    document.getElementById('reset-modal').style.display = 'flex'
    setTimeout(() => document.getElementById('reset-new-pass').focus(), 50)
  }
  function cancelReset(e) {
    if (e && e.target !== document.getElementById('reset-modal')) return
    document.getElementById('reset-modal').style.display = 'none'
    resetUserId = null
  }
  function cancelReset() {
    document.getElementById('reset-modal').style.display = 'none'
    resetUserId = null
  }
  async function confirmReset() {
    const pass = document.getElementById('reset-new-pass').value
    if (pass.length < 6) { toast('Hasło musi mieć min. 6 znaków', true); return }
    const res = await fetch(`/api/users/${resetUserId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pass })
    })
    document.getElementById('reset-modal').style.display = 'none'
    resetUserId = null
    if (!res.ok) { const d = await res.json(); toast(d.error, true); return }
    toast('Hasło zostało zmienione')
  }

  // ── Dark mode ──
  function applyTheme(dark) {
    document.body.classList.toggle('dark', dark)
    document.getElementById('theme-btn').textContent = dark ? '☀️' : '🌙'
  }
  function toggleTheme() {
    const dark = !document.body.classList.contains('dark')
    localStorage.setItem('vectra-theme', dark ? 'dark' : 'light')
    applyTheme(dark)
  }
  applyTheme(localStorage.getItem('vectra-theme') === 'dark')

  // Init
  fetch('/api/me').then(r => r.json()).then(me => {
    document.getElementById('admin-email').textContent = me.email
  })
  loadUsers()
</script>
</body>
</html>
